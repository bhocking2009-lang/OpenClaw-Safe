name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Download portable Node.js runtime
        shell: pwsh
        run: |
          $nodeVersion = "20.11.1"
          $nodeUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $nodeUrl -OutFile "node-win.zip"
          Expand-Archive -Path "node-win.zip" -DestinationPath "node-runtime"
          Rename-Item "node-runtime\node-v$nodeVersion-win-x64" "node-runtime\node"

      - name: Prepare distribution bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-pkg" -Force
          Copy-Item -Path "dist" -Destination "dist-pkg\dist" -Recurse
          Copy-Item -Path "node_modules" -Destination "dist-pkg\node_modules" -Recurse
          Copy-Item -Path "node-runtime\node" -Destination "dist-pkg\node" -Recurse
          Copy-Item -Path "packaging\windows\launcher.bat" -Destination "dist-pkg\launcher.bat"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $nsisPath packaging\windows\installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Safe-Setup
          path: OpenClaw-Safe-Setup.exe
          retention-days: 30

      - name: Create GitHub Release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenClaw-Safe-Setup.exe
