[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-safe"
version = "0.1.0"
description = "Secure version of OpenClaw with proper security protocols for home use"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["openclaw_safe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
